<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Beny-Joe Cloud — Connexion...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0b0f'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='38' font-family='Arial'>☁️%3C/text%3E%3C/svg%3E"/>
  <style>
    .callback-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: 20px; text-align: center; }
    .callback-spinner { font-size: 48px; color: var(--accent); animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .callback-text { font-size: 16px; color: var(--text-secondary); }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="callback-page">
    <div class="brand-icon"><i class="fa-solid fa-cloud-bolt"></i></div>
    <div class="callback-spinner">⟳</div>
    <p class="callback-text" id="statusText">Connexion en cours...</p>
  </div>
  <footer class="site-footer">
    <span>☁️ Beny-Joe Cloud</span>
    <span class="footer-sep">·</span>
    <span>© 2026 khedim benyakhlef dit beny joe – Tous droits réservés</span>
    <span class="footer-sep">·</span>
    <a href="mailto:khedimbenyakhlef@gmail.com">khedimbenyakhlef@gmail.com</a>
  </footer>
  <script src="js/api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const error = params.get('error');

    if (error) {
      document.getElementById('statusText').textContent = 'Erreur : ' + error;
      setTimeout(() => window.location.href = 'index.html', 2000);
    } else if (token) {
      setToken(token);
      Auth.me().then(user => {
        setUser(user);
        document.getElementById('statusText').textContent = 'Bienvenue ' + (user.name || '') + ' !';
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      }).catch(() => {
        document.getElementById('statusText').textContent = 'Erreur de connexion';
        setTimeout(() => window.location.href = 'index.html', 2000);
      });
    } else {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
