<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Beny-Joe Cloud — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0b0f'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='38' font-family='Arial'>☁️%3C/text%3E%3C/svg%3E"/>
</head>
<body class="auth-page">
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div class="auth-container">
    <div class="auth-brand">
      <div class="brand-icon"><i class="fa-solid fa-cloud-bolt"></i></div>
      <h1 class="brand-name">Beny-Joe Cloud</h1>
      <p class="brand-tagline">Déployez vos apps en quelques secondes</p>
    </div>

    <!-- LOGIN -->
    <div class="auth-card" id="loginCard">
      <h2>Connexion</h2>
      <button class="btn-google" onclick="loginWithGoogle()">
        <img src="https://www.google.com/favicon.ico" alt="Google" width="18">
        Continuer avec Google
      </button>
      <div class="divider"><span>ou</span></div>
      <div id="loginError" class="alert alert-error" style="display:none"></div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="vous@exemple.com" />
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <div class="input-icon">
          <input type="password" id="loginPassword" placeholder="••••••••" />
          <i class="fa-regular fa-eye toggle-pw" onclick="togglePw('loginPassword',this)"></i>
        </div>
      </div>
      <button class="btn-primary" onclick="login()">
        <span>Se connecter</span><i class="fa-solid fa-arrow-right"></i>
      </button>
      <p class="auth-switch">Pas encore de compte ? <a href="#" onclick="showRegister()">S'inscrire</a></p>
    </div>

    <!-- REGISTER -->
    <div class="auth-card" id="registerCard" style="display:none">
      <h2>Créer un compte</h2>
      <button class="btn-google" onclick="loginWithGoogle()">
        <img src="https://www.google.com/favicon.ico" alt="Google" width="18">
        S'inscrire avec Google
      </button>
      <div class="divider"><span>ou</span></div>
      <div id="registerError" class="alert alert-error" style="display:none"></div>
      <div class="form-group">
        <label>Nom complet</label>
        <input type="text" id="registerName" placeholder="Votre nom" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="registerEmail" placeholder="vous@exemple.com" />
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <div class="input-icon">
          <input type="password" id="registerPassword" placeholder="••••••••" />
          <i class="fa-regular fa-eye toggle-pw" onclick="togglePw('registerPassword',this)"></i>
        </div>
      </div>
      <button class="btn-primary" onclick="register()">
        <span>Créer mon compte</span><i class="fa-solid fa-arrow-right"></i>
      </button>
      <p class="auth-switch">Déjà inscrit ? <a href="#" onclick="showLogin()">Se connecter</a></p>
    </div>
  </div>

  <footer class="site-footer">
    <span>☁️ Beny-Joe Cloud</span>
    <span class="footer-sep">·</span>
    <span>© 2026 khedim benyakhlef dit beny joe – Tous droits réservés</span>
    <span class="footer-sep">·</span>
    <a href="mailto:khedimbenyakhlef@gmail.com">khedimbenyakhlef@gmail.com</a>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
